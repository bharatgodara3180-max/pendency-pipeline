name: Pendency Pipeline

on:
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: pendency-github@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Download pendency reports + update FWD/REV RAW
        env:
          SHADOWFAX_USERNAME: ${{ secrets.SHADOWFAX_USERNAME }}
          SHADOWFAX_PASSWORD: ${{ secrets.SHADOWFAX_PASSWORD }}
          AUDIT_SHEET_ID: ${{ secrets.AUDIT_SHEET_ID }}
        run: python download_pendency.py

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-screenshots
          path: debug_screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build audit master table
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          AUDIT_SHEET_ID: ${{ secrets.AUDIT_SHEET_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPIC_REV: ${{ secrets.NTFY_TOPIC_REV }}
          NTFY_TOPIC_SKIP: ${{ secrets.NTFY_TOPIC_SKIP }}
        run: python build_audit_master.py
