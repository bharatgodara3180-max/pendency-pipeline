name: Pendency Pipeline

on:
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/675320224022/locations/global/workloadIdentityPools/github-pendency/providers/github
          service_account: pendency-github@flawless-energy-507612-e0.iam.gserviceaccount.com

      - name: Download pendency reports
        env:
          SHADOWFAX_USERNAME: ${{ secrets.SHADOWFAX_USERNAME }}
          SHADOWFAX_PASSWORD: ${{ secrets.SHADOWFAX_PASSWORD }}
          AUDIT_SHEET_ID: ${{ secrets.AUDIT_SHEET_ID }}
        run: python download_pendency.py

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-screenshots
          path: debug_screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Push snapshots to Cloudflare KV
        env:
          CF_API_URL: ${{ secrets.CF_API_URL }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python upload_snapshots.py

      - name: Build audit master table
        env:
          CF_API_URL: ${{ secrets.CF_API_URL }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          AUDIT_SHEET_ID: ${{ secrets.AUDIT_SHEET_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPIC_REV: ${{ secrets.NTFY_TOPIC_REV }}
          NTFY_TOPIC_SKIP: ${{ secrets.NTFY_TOPIC_SKIP }}
        run: python build_audit_master.py
