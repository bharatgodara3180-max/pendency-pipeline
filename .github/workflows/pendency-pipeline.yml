name: Pendency Pipeline

on:
  workflow_dispatch:  # adds a manual "Run workflow" button in the Actions tab
  schedule:
    - cron: '5,20,35,50 * * * *'   # UTC minutes that land on IST :05/:20/:35/:50, every hour, 24 hours

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Download pendency reports
        env:
          SHADOWFAX_USERNAME: ${{ secrets.SHADOWFAX_USERNAME }}
          SHADOWFAX_PASSWORD: ${{ secrets.SHADOWFAX_PASSWORD }}
        run: python download_pendency.py

      - name: Upload debug screenshots
        if: failure()   # only runs (and only exists) when something actually failed
        uses: actions/upload-artifact@v7
        with:
          name: debug-screenshots
          path: debug_screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Push to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python upload_to_supabase.py

      - name: Build audit master table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          AUDIT_SHEET_ID: ${{ secrets.AUDIT_SHEET_ID }}
        run: python build_audit_master.py
