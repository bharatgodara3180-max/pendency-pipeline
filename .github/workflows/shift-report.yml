name: Shift Report

on:
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send shift report
        env:
          CF_API_URL: ${{ secrets.CF_API_URL }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          NTFY_SHIFT_TOPIC: ${{ secrets.NTFY_SHIFT_TOPIC }}
        run: python shift_report.py
