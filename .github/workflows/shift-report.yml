name: Shift Report
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: pendency-github@flawless-energy-507612-e0.iam.gserviceaccount.com
      - name: Send shift report
        env:
          AUDIT_SHEET_ID: ${{ secrets.AUDIT_SHEET_ID }}
          NTFY_SHIFT_TOPIC: ${{ secrets.NTFY_SHIFT_TOPIC }}
        run: python shift_report.py
