name: Shift Report

on:
  workflow_dispatch:
  schedule:
    - cron: '5 8 * * *'
      timezone: 'Asia/Kolkata'   # 8:05 AM IST -- night shift (8PM-8AM) report
    - cron: '5 20 * * *'
      timezone: 'Asia/Kolkata'   # 8:05 PM IST -- day shift (8AM-8PM) report

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install supabase requests

      - name: Send shift report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NTFY_SHIFT_TOPIC: ${{ secrets.NTFY_SHIFT_TOPIC }}
        run: python shift_report.py
